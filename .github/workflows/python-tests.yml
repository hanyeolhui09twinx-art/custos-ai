name: Custos Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run automated Python tests
        run: python -m unittest discover -s tests -v

      - name: Check browser console script and security wiring
        run: node tests/check_studio_console.js

      - name: Validate browser Simulation Lab behavior
        run: node tests/check_simulation_lab.js

      - name: Validate corporate website routes and content
        run: node tests/check_corporate_site.js

  corporate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Playwright
        run: |
          npm init -y --silent
          npm install --no-save --package-lock=false playwright@1.64.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start static website server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory simulation-studio > /tmp/custos-pages.log 2>&1 &
          echo $! > /tmp/custos-pages.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/custos-pages.log
          exit 1

      - name: Run desktop, mobile, language, navigation, and media checks
        run: node tests/check_corporate_browser.js
        env:
          CUSTOS_BASE_URL: http://127.0.0.1:4173
          CUSTOS_BROWSER_ARTIFACTS: artifacts/custos-browser

      - name: Upload screenshots and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: custos-corporate-browser-evidence
          path: artifacts/custos-browser/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop static website server
        if: ${{ always() }}
        run: |
          if [ -f /tmp/custos-pages.pid ]; then kill "$(cat /tmp/custos-pages.pid)" || true; fi

  agent-sdk-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned OpenAI Agents SDK
        run: python -m pip install --disable-pip-version-check -r requirements-agents.txt

      - name: Test Custos-mediated Agents SDK tools
        run: python -m unittest tests.test_openai_agents_sdk -v
