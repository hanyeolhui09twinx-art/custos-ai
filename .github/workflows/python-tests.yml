name: Custos Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run automated Python tests
        run: python -m unittest discover -s tests -v

      - name: Check browser console script and security wiring
        run: node tests/check_studio_console.js

      - name: Validate corporate website routes and content
        run: node tests/check_corporate_site.js
