name: Custos Corporate Browser Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "simulation-studio/**"
      - "tests/check_corporate_browser.js"
      - ".github/workflows/corporate-browser.yml"
  push:
    branches:
      - main
    paths:
      - "simulation-studio/**"
      - "tests/check_corporate_browser.js"
      - ".github/workflows/corporate-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custos-corporate-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Playwright
        run: |
          npm init -y --silent
          npm install --no-save --package-lock=false playwright@1.64.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start static website server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory simulation-studio > /tmp/custos-pages.log 2>&1 &
          echo $! > /tmp/custos-pages.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/custos-pages.log
          exit 1

      - name: Run desktop, mobile, language, navigation, and media checks
        run: node tests/check_corporate_browser.js
        env:
          CUSTOS_BASE_URL: http://127.0.0.1:4173
          CUSTOS_BROWSER_ARTIFACTS: artifacts/custos-browser

      - name: Upload screenshots and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: custos-corporate-browser-evidence
          path: artifacts/custos-browser/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop static website server
        if: ${{ always() }}
        run: |
          if [ -f /tmp/custos-pages.pid ]; then kill "$(cat /tmp/custos-pages.pid)" || true; fi
