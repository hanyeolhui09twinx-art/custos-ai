[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custos-ai"
version = "0.4.0"
description = "A fail-closed action-control gateway between AI agents and the tools they use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["gmpy2>=2.1"]

[project.scripts]
custos = "custos.cli:main"

[tool.setuptools]
packages = ["custos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
